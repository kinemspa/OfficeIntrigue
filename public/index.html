<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Intrigue - Social Deduction Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .hidden {
            display: none !important;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        .environment-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .env-option {
            padding: 20px;
            border: 3px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .env-option:hover {
            border-color: #667eea;
            transform: translateY(-3px);
        }

        .env-option.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .players-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }

        .player-card {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .player-card.impostor {
            border-left-color: #dc3545;
            background: #fff5f5;
        }

        .tasks-grid {
            display: grid;
            gap: 15px;
        }

        .task-card {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #28a745;
        }

        .task-card.completed {
            opacity: 0.6;
            border-left-color: #6c757d;
        }

        .task-card .task-title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .task-card .task-slots {
            font-size: 0.9em;
            color: #666;
        }

        .integrity-meter {
            height: 30px;
            background: #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
        }

        .integrity-fill {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #20c997);
            transition: width 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .status-pending {
            background: #ffc107;
            color: #333;
        }

        .status-active {
            background: #28a745;
            color: white;
        }

        .status-ended {
            background: #6c757d;
            color: white;
        }

        .role-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.85em;
            font-weight: bold;
            margin-left: 8px;
        }

        .role-crew {
            background: #d1ecf1;
            color: #0c5460;
        }

        .role-impostor {
            background: #f8d7da;
            color: #721c24;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .action-buttons button {
            flex: 1;
        }

        #errorMessage {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕵️ Office Intrigue</h1>

        <!-- Error display -->
        <div id="errorMessage" class="hidden"></div>

        <!-- Create/Join Game Screen -->
        <div id="menuScreen" class="card">
            <h2>Start Playing</h2>
            <div>
                <h3>Create New Game</h3>
                <div class="environment-selector">
                    <div class="env-option selected" data-env="office">
                        <h4>🏢 Office</h4>
                        <p>TPS reports & meetings</p>
                    </div>
                    <div class="env-option" data-env="spaceship">
                        <h4>🚀 Spaceship</h4>
                        <p>Nav systems & repairs</p>
                    </div>
                    <div class="env-option" data-env="pirate-ship">
                        <h4>🏴‍☠️ Pirate Ship</h4>
                        <p>Treasure & mutiny</p>
                    </div>
                </div>
                <button id="createGameBtn">Create Game</button>
            </div>
            <hr style="margin: 30px 0;">
            <div>
                <h3>Join Existing Game</h3>
                <input type="text" id="joinGameId" placeholder="Enter Game ID">
                <input type="text" id="playerName" placeholder="Your Name">
                <button id="joinGameBtn">Join Game</button>
            </div>
        </div>

        <!-- Lobby Screen -->
        <div id="lobbyScreen" class="hidden card">
            <h2>Game Lobby</h2>
            <p><strong>Game ID:</strong> <span id="lobbyGameId"></span></p>
            <p><strong>Environment:</strong> <span id="lobbyEnvironment"></span></p>
            <p><strong>Status:</strong> <span id="lobbyStatus" class="status-badge"></span></p>
            
            <h3>Players (<span id="playerCount">0</span>)</h3>
            <div class="players-list" id="lobbyPlayers"></div>
            
            <button id="startGameBtn">Start Game</button>
            <button id="backToMenuBtn">Back to Menu</button>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="hidden card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>🎮 Game In Progress</h2>
                <div>
                    <span id="yourRole"></span>
                    <button id="refreshBtn" style="margin-left: 15px;">🔄 Refresh</button>
                </div>
            </div>
            
            <h3>Integrity Meter</h3>
            <div class="integrity-meter">
                <div class="integrity-fill" id="integrityBar">100%</div>
            </div>

            <h3>Tasks</h3>
            <div class="tasks-grid" id="tasksContainer"></div>

            <h3>Players</h3>
            <div class="players-list" id="gamePlayers"></div>

            <button id="leaveGameBtn">Leave Game</button>
        </div>
    </div>

    <script src="/js/game.js"></script>
</body>
</html>
